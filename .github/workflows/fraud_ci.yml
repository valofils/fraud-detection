# ── Fraud Detection CI/CD ─────────────────────────────────────────────────────
# Triggers:
#   push / PR → main         : lint + test
#   push to main             : + Docker build/push
#   creditcard_features.csv  : + retrain pipeline
#   manual dispatch          : full pipeline with optional --force flag
#
# Secrets required (Settings → Secrets → Actions):
#   DOCKER_USERNAME          DockerHub username
#   DOCKER_PASSWORD          DockerHub token
#   MLFLOW_TRACKING_URI      e.g. http://your-mlflow-host:5000 (optional)
# ---------------------------------------------------------------------------

name: Fraud Detection CI/CD

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - ".gitignore"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**.md"
      - ".gitignore"
  workflow_dispatch:
    inputs:
      force_promote:
        description: "Force model promotion regardless of PR-AUC gate"
        required: false
        default: "false"
        type: choice
        options: ["true", "false"]
      skip_retrain:
        description: "Skip retraining, run tests + Docker only"
        required: false
        default: "false"
        type: choice
        options: ["true", "false"]

env:
  PYTHON_VERSION: "3.11"
  IMAGE_NAME: ${{ secrets.DOCKER_USERNAME }}/fraud-detection-api
  MODEL_CACHE_KEY: models-${{ hashFiles('creditcard_features.csv') }}

# ---------------------------------------------------------------------------
jobs:

  # ── 1. Lint ────────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install linters
        run: pip install ruff mypy

      - name: Ruff — format + style
        run: ruff check . --select E,W,F,I --ignore E501

      - name: Mypy — type check API
        run: mypy fraud_api_phase6.py --ignore-missing-imports --no-strict-optional


  # ── 2. Test ────────────────────────────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt pytest pytest-cov httpx

      - name: Restore cached models
        id: model-cache
        uses: actions/cache@v4
        with:
          path: models/
          key: ${{ env.MODEL_CACHE_KEY }}

      - name: Download models (cache miss)
        if: steps.model-cache.outputs.cache-hit != 'true'
        run: |
          echo "No cached models — downloading from release assets or DVC"
          # Replace with your actual model source, e.g.:
          # dvc pull models/
          # or: gh release download v1.0 --pattern "*.joblib" --dir models/
          echo "WARNING: models/ not found, some tests may be skipped"

      - name: Run test suite
        run: |
          pytest tests/ \
            --cov=fraud_api_phase6 \
            --cov-report=xml \
            --cov-report=term-missing \
            -v \
            --tb=short
        env:
          PYTHONPATH: .

      - name: Upload coverage report
        uses: codecov/codecov-action@v4
        with:
          file: coverage.xml
          fail_ci_if_error: false


  # ── 3. Retrain ─────────────────────────────────────────────────────────────
  retrain:
    name: Retrain
    runs-on: ubuntu-latest
    needs: test
    # Run on: push to main with data change, or manual dispatch without skip
    if: |
      (github.event_name == 'push' &&
       contains(github.event.head_commit.modified, 'creditcard_features.csv')) ||
      (github.event_name == 'workflow_dispatch' &&
       github.event.inputs.skip_retrain == 'false')
    outputs:
      promoted: ${{ steps.retrain.outputs.promoted }}
      pr_auc:   ${{ steps.retrain.outputs.pr_auc }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore cached models (champion backup)
        uses: actions/cache@v4
        with:
          path: models/
          key: ${{ env.MODEL_CACHE_KEY }}
          restore-keys: models-

      - name: Run retraining pipeline
        id: retrain
        run: |
          FORCE_FLAG=""
          if [ "${{ github.event.inputs.force_promote }}" == "true" ]; then
            FORCE_FLAG="--force"
          fi

          python fraud_retrain_phase8a.py $FORCE_FLAG 2>&1 | tee retrain.log

          # Parse promotion outcome from summary CSV
          PROMOTED=$(python -c "
          import pandas as pd, sys
          try:
              df = pd.read_csv('results/retrain_phase8_summary.csv')
              xgb = df[df['model']=='xgboost'].iloc[0]
              print(str(xgb['promoted']).lower())
          except Exception as e:
              print('false')
          ")
          PR_AUC=$(python -c "
          import pandas as pd
          try:
              df = pd.read_csv('results/retrain_phase8_summary.csv')
              xgb = df[df['model']=='xgboost'].iloc[0]
              print(f\"{xgb['pr_auc']:.4f}\")
          except:
              print('0.0')
          ")

          echo "promoted=$PROMOTED" >> $GITHUB_OUTPUT
          echo "pr_auc=$PR_AUC"     >> $GITHUB_OUTPUT
          echo "XGBoost promoted=$PROMOTED | PR-AUC=$PR_AUC"
        env:
          MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI || 'http://localhost:5000' }}

      - name: Upload retrain artifacts
        uses: actions/upload-artifact@v4
        with:
          name: retrain-results-${{ github.run_number }}
          path: |
            results/retrain_phase8_summary.csv
            results/test_split_phase8.csv
            models/feature_names_phase8.json
            retrain.log
          retention-days: 30

      - name: Cache promoted models
        if: steps.retrain.outputs.promoted == 'true'
        uses: actions/cache@v4
        with:
          path: models/
          key: ${{ env.MODEL_CACHE_KEY }}-promoted-${{ github.run_number }}

      - name: Comment PR-AUC result on commit
        uses: actions/github-script@v7
        with:
          script: |
            const promoted = '${{ steps.retrain.outputs.promoted }}';
            const prAuc    = '${{ steps.retrain.outputs.pr_auc }}';
            const icon     = promoted === 'true' ? '✅' : '⏸';
            const msg      = promoted === 'true'
              ? `New champion promoted — PR-AUC: **${prAuc}**`
              : `Champion retained — challenger PR-AUC: **${prAuc}** (below gate 0.002)`;
            github.rest.repos.createCommitComment({
              owner:      context.repo.owner,
              repo:       context.repo.repo,
              commit_sha: context.sha,
              body:       `${icon} Retrain: ${msg}`,
            });


  # ── 4. Docker build & push ─────────────────────────────────────────────────
  docker:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: [test, retrain]
    # Run if tests pass; retrain is allowed to be skipped
    if: |
      always() &&
      needs.test.result == 'success' &&
      (needs.retrain.result == 'success' || needs.retrain.result == 'skipped') &&
      github.event_name != 'pull_request'

    steps:
      - uses: actions/checkout@v4

      - name: Restore promoted models (if retrain ran)
        if: needs.retrain.outputs.promoted == 'true'
        uses: actions/cache@v4
        with:
          path: models/
          key: ${{ env.MODEL_CACHE_KEY }}-promoted-${{ github.run_number }}

      - name: Restore champion models (fallback)
        if: needs.retrain.outputs.promoted != 'true'
        uses: actions/cache@v4
        with:
          path: models/
          key: ${{ env.MODEL_CACHE_KEY }}
          restore-keys: models-

      - name: Set image tags
        id: tags
        run: |
          SHA_SHORT=$(git rev-parse --short HEAD)
          echo "sha=${SHA_SHORT}" >> $GITHUB_OUTPUT
          echo "image=${{ env.IMAGE_NAME }}" >> $GITHUB_OUTPUT

          # Promoted model gets 'latest'; otherwise only sha tag
          if [ "${{ needs.retrain.outputs.promoted }}" == "true" ]; then
            echo "tags=${{ env.IMAGE_NAME }}:latest,${{ env.IMAGE_NAME }}:${SHA_SHORT}" >> $GITHUB_OUTPUT
          else
            echo "tags=${{ env.IMAGE_NAME }}:${SHA_SHORT}" >> $GITHUB_OUTPUT
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          dockerfile: Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            GIT_SHA=${{ steps.tags.outputs.sha }}

      - name: Image digest
        run: echo "Pushed ${{ steps.tags.outputs.tags }}"


  # ── 5. Smoke test deployed image ───────────────────────────────────────────
  smoke:
    name: Smoke Test
    runs-on: ubuntu-latest
    needs: docker
    if: needs.docker.result == 'success'

    steps:
      - uses: actions/checkout@v4

      - name: Pull and start API container
        run: |
          docker pull ${{ env.IMAGE_NAME }}:${{ needs.docker.outputs.sha || 'latest' }} || \
          docker pull ${{ env.IMAGE_NAME }}:latest
          docker run -d \
            --name fraud-api-smoke \
            -p 8000:8000 \
            ${{ env.IMAGE_NAME }}:latest
          echo "Waiting for API to be ready..."
          for i in $(seq 1 20); do
            if curl -sf http://localhost:8000/health > /dev/null 2>&1; then
              echo "API ready after ${i}s"
              break
            fi
            sleep 2
          done

      - name: Health check
        run: |
          HEALTH=$(curl -sf http://localhost:8000/health)
          echo "$HEALTH"
          echo "$HEALTH" | python -c "
          import json, sys
          h = json.load(sys.stdin)
          assert h['status'] == 'ok', f'Expected ok, got {h[\"status\"]}'
          assert h['model_loaded'] == True, 'Model not loaded'
          assert h['threshold'] == 0.192, f'Wrong threshold: {h[\"threshold\"]}'
          print('Health check passed')
          "

      - name: Fraud vector smoke test
        run: |
          RESULT=$(curl -sf -X POST http://localhost:8000/predict \
            -H "Content-Type: application/json" \
            -d '{
              "V1":-2.31,"V2":1.95,"V3":-1.61,"V4":3.41,
              "V5":-0.95,"V6":-1.15,"V7":-2.81,"V8":0.39,
              "V9":-0.82,"V10":-2.75,"V11":2.74,"V12":-2.24,
              "V13":0.17,"V14":-6.50,"V15":0.22,"V16":-2.19,
              "V17":-2.02,"V18":-1.71,"V19":0.38,"V20":0.13,
              "V21":0.49,"V22":-0.14,"V23":-0.08,"V24":0.05,
              "V25":0.21,"V26":0.13,"V27":0.24,"V28":0.06,
              "Amount_scaled":-0.18,"Hour_sin":0.98,"Hour_cos":0.17,
              "Amount_log":2.28,"Amount_bin":0,
              "Is_micro":1,"Is_large":0,"Is_night":0,"Is_peak":1,
              "V14_x_V12":14.56,"V4_x_V11":9.34,
              "V10_x_V16":6.02,"V3_x_V9":1.32,
              "V14_x_V17":13.13,"Amount_x_V14":-63.83,
              "Amount_x_V4":33.49,"Amount_x_V12":-21.99,
              "V2_x_Amount":19.15,
              "Top_V_mean":-1.24,"Top_V_std":1.89,
              "Top_V_max_abs":6.50,"Top_V_l2_norm":9.73,
              "Risk_score":0.82
            }')
          echo "$RESULT"
          echo "$RESULT" | python -c "
          import json, sys
          r = json.load(sys.stdin)
          assert r['is_fraud'] == True,        f'Expected fraud, got {r}'
          assert r['fraud_probability'] > 0.99, f'Probability too low: {r[\"fraud_probability\"]}'
          assert r['decision'] in ('BLOCK','REVIEW'), f'Bad decision: {r[\"decision\"]}'
          print(f'Smoke test passed — prob={r[\"fraud_probability\"]:.6f} decision={r[\"decision\"]}')
          "

      - name: Cleanup
        if: always()
        run: docker rm -f fraud-api-smoke || true
